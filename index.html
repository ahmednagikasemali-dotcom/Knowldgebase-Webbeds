<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebBeds - Executive Operations Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #e60000; --success: #27ae60; --warning: #f39c12; --danger: #ff4757; }
        body { margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif; color: white; display: flex; height: 100vh; overflow: hidden; background-color: #111; }
        
        #bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; transition: background-image 1.5s ease-in-out; background-size: cover; background-position: center; }
        #bg-dimmer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: rgba(0, 0, 0, 0.25); }

        /* Main Content */
        #main { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; position: relative; overflow-y: auto; width: 100%; }
        #search-container { width: 100%; max-width: 600px; margin-bottom: 40px; position: relative; }
        #search-container input { width: 100%; padding: 16px 20px 16px 50px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.35); backdrop-filter: blur(12px); color: white; box-sizing: border-box; outline: none; font-size: 1rem; box-shadow: 0 10px 30px rgba(0,0,0,0.3); transition: border-color 0.3s; }
        #search-container input:focus { border-color: var(--primary); }
        #search-container i { position: absolute; left: 20px; top: 19px; color: var(--primary); font-size: 1.1rem; }

        #tabs-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 1200px; }
        .tab-item { position: relative; padding-bottom: 10px; } 
        .tab-trigger { background: rgba(15, 15, 15, 0.6); backdrop-filter: blur(12px); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 12px 22px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.85rem; box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: all 0.3s; }
        .tab-trigger:hover { border-color: var(--primary); background: rgba(25, 25, 25, 0.8); transform: translateY(-2px); }
        
        .dropdown { 
            visibility: hidden; opacity: 0; position: absolute; top: 100%; left: 0; 
            background: rgba(15, 15, 15, 0.88); backdrop-filter: blur(16px); min-width: 250px; border-radius: 8px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.4); z-index: 5000; 
            margin-top: 8px; padding: 6px 0; transition: all 0.25s ease; border: 1px solid rgba(255,255,255,0.15);
        }
        
        .tab-item:hover > .dropdown, .tab-item.searching > .dropdown { visibility: visible; opacity: 1; display: block; margin-top: 4px; }
        
        .drop-link { display: block; padding: 12px 18px; color: #ddd; text-decoration: none; font-size: 0.85rem; font-weight: 500; position: relative; background: transparent; transition: background 0.2s, color 0.2s; }
        .drop-link:hover { background: rgba(230, 0, 0, 0.2); color: #fff; }
        .match-highlight { background-color: rgba(255, 250, 144, 0.25) !important; color: #fffa90 !important; border-left: 3px solid var(--primary); }

        .has-sub { position: relative; }
        .sub-dropdown { 
            visibility: hidden; opacity: 0; position: absolute; left: 100%; top: -6px; 
            background: rgba(15, 15, 15, 0.88); backdrop-filter: blur(16px); min-width: 220px; border-radius: 8px;
            padding: 6px 0; box-shadow: 0 15px 35px rgba(0,0,0,0.4); transition: all 0.25s ease; border: 1px solid rgba(255,255,255,0.15);
        }
        
        .has-sub:hover > .sub-dropdown, .has-sub.searching > .sub-dropdown { visibility: visible; opacity: 1; display: block; }

        #feedback-btn { position: fixed; bottom: 30px; right: 30px; width: 55px; height: 55px; background: var(--primary); border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 6px 20px rgba(230,0,0,0.5); z-index: 3000; transition: transform 0.2s; }
        #feedback-btn:hover { transform: scale(1.05); }
        #feedback-modal { position: fixed; bottom: 100px; right: 30px; width: 300px; background: rgba(15,15,15,0.9); backdrop-filter: blur(16px); color: white; border-radius: 12px; display: none; flex-direction: column; box-shadow: 0 15px 40px rgba(0,0,0,0.5); z-index: 3000; overflow: hidden; border: 1px solid rgba(255,255,255,0.2); }
    </style>
</head>
<body>

<div id="bg-overlay"></div>
<div id="bg-dimmer"></div>

<div id="main">
    <div style="font-size: 1.8rem; font-weight: 900; margin-bottom: 20px; color: var(--primary); letter-spacing: 1px; text-align: center; text-shadow: 0 2px 10px rgba(0,0,0,0.5);">WEB<span style="color:white">BEDS</span> - SOP HUB</div>
    <div id="search-container">
        <i class="fas fa-search"></i>
        <input type="text" id="sopSearch" placeholder="Search SOPs (Nusuk, ArabiaBeds, Mapping...)" onkeyup="filterTabs()">
    </div>
    <div id="tabs-row"></div>
</div>

<div id="feedback-btn" onclick="toggleFeedback()"><i class="fas fa-comment-dots" style="font-size:1.2rem;"></i></div>
<div id="feedback-modal">
    <div style="background:var(--primary); padding:12px 15px; color:white; font-weight:bold; display:flex; justify-content:space-between; align-items:center;">
        <span>Shift Notes & Feedback</span><span onclick="toggleFeedback()" style="cursor:pointer; font-size:1.2rem;">&times;</span>
    </div>
    <div style="padding:15px">
        <textarea id="fb-text" placeholder="Type internal shift notes..." style="width:100%; height:90px; padding:10px; background:rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.2); color:white; border-radius:6px; resize:none; outline:none; box-sizing:border-box;"></textarea>
        <button style="background: var(--success); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px;" onclick="sendFeedback()">SAVE NOTES</button>
    </div>
</div>

<script>
// --- Data Section ---
const tabsData = {
    "Booking Creation": { subTabs: { "Booking Creation": { url: "booking_creation.html" }, "Tours & Transfers": { url: "tours_transfers.html" }, "Misc Creation": { url: "misc_creation.html" }, "Different Booking Statuses": { url: "different_booking_statuses.html" } } },
    "Answering Queries": { subTabs: { "Booking Confirmation": { url: "booking_confirmation.html" }, "Special Requests": { url: "special_requests.html", tags: "nusuk umrah hajj ksa" }, "Booking Cancellation": { subTabs: { "Cancellation Step": { url: "booking_cancellation_Steps.html" }, "MOR": { url: "booking_cancellation_mor.html" }, "GSA & VIP": { url: "booking_cancellation_gsa_vip.html" } } }, "Extras and Supplements": { url: "extras_and_supplements.html" }, "Amendment": { subTabs: { "Amend Steps": { url: "amend_steps.html" }, "Kinds of Amend": { url: "kinds_of_Amend.html" }, "Amend a Miscellaneous": { url: "amend_misc.html" }, "Amend Online": { url: "amend_online.html" }, "Amend Offline": { url: "amend_offline.html" }, "Amend Multi-Room": { url: "amend_multi_room.html" } } } } },
    "Issues Management": { subTabs: { "Loading Errors": { url: "Loading_Errors.html" }, "Relocation": { url: "relocation.html" }, "OTS": { url: "ots.html" }, "Payment Issue": { url: "payment_issue.html" }, "Mapping": { url: "mapping.html" }, "Nationality Issue": { url: "nationality_issue.html" } } },
    "Booking Management": { subTabs: { "Hotel / Customer Info Update": { url: "hotel_customer_update.html" } } },
    "Fraud": { subTabs: { "Fraud Handling": { url: "fraud_Handling.html" } } },
    "Offline & Visa": { subTabs: { "Visa Procedures": { url: "visa_procedures.html" }, "Visa Prices": { url: "visa_prices.html" }, "Offline Procedures": { url: "offline_procedures.html" }, "Offline Suppliers": { url: "offline_suppliers.html" } } },
    "Others": { subTabs: { "Finance & Escalations": { url: "Finance_Escalations.html" }, "vCarly P4": { url: "vCarly_P4.html" }, "VCC FAQ": { url: "VCC_FAQ.html" }, "WebRev": { url: "WebRev.html" }, "PST task types": { url: "PST_task_types_L1_to_L2.html" }, "In resort task types": { url: "In resort_task_types_L1_to_L2.html" } } },
    "Quality & KPI": { subTabs: { "QA Criteria": { url: "QA_Agent_Criteria.html" }, "Call Quality": { url: "Call_Quality_Steps.html" }, "Ownership": { url: "Ownership.html" }, "QA Guidelines": { url: "QA_quick_guidelines.html" }, "KPI Report": { url: "Agent_KPI.html" } } },
    "System": { subTabs: { "Freshdesk": { url: "Freshdesk_System.html" }, "Dotw System": { url: "Dotw_System.html" }, "Sunhotels": { url: "sunhotels_System.html" }, "Refund Calculator": { url: "Refund_calculator.html" } } },
    "Important": { subTabs: { "FD Categories": { url: "FD_cases_categories.html" }, "Connectivity": { url: "Supplier_Connectivity.html" }, "Supplier Info": { url: "Supplier_Information.html" }, "Saudia DMC": { url: "Saudia_DMC.html" }, "Contracting": { url: "Contracting_Information.html" } } },
    "Updates": { subTabs: { "Last Update": { url: "Last_update.html", tags: "nusuk Prime AL Matar" } } }
};

// --- 7 Nature Backgrounds Slider Configuration ---
const bgImages = [
    "https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=1600",
    "https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1600",
    "https://images.unsplash.com/photo-1426604966848-d7adacbd02bff?w=1600",
    "https://images.unsplash.com/photo-1454496522488-7a8e488e8606?w=1600",
    "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1600",
    "https://images.unsplash.com/photo-1511497584788-876761192512?w=1600",
    "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=1600"
];
let currentBgIndex = 0;

function rotateBackground() {
    currentBgIndex = (currentBgIndex + 1) % bgImages.length;
    document.getElementById('bg-overlay').style.backgroundImage = `url('${bgImages[currentBgIndex]}')`;
}

// Rotate background automatically every 10 seconds
setInterval(rotateBackground, 10000);

function build(data, container, isRoot = false) {
    for (let key in data) {
        const item = data[key]; const div = document.createElement('div');
        if (isRoot) {
            div.className = 'tab-item'; div.innerHTML = `<div class="tab-trigger">${key}</div>`;
            const drop = document.createElement('div'); drop.className = 'dropdown';
            build(item.subTabs, drop, false); div.appendChild(drop);
        } else {
            if (item.subTabs) {
                div.className = 'drop-link has-sub'; div.innerHTML = `<span>${key}</span> <i class="fas fa-caret-right" style="float:right; margin-top:3px;"></i>`;
                const sub = document.createElement('div'); sub.className = 'sub-dropdown';
                build(item.subTabs, sub, false); div.appendChild(sub);
            } else { 
                div.innerHTML = `<a href="${item.url}" class="drop-link" data-tags="${item.tags || ''}">${key}</a>`; 
            }
        }
        container.appendChild(div);
    }
}

function filterTabs() {
    let q = document.getElementById('sopSearch').value.toLowerCase();
    document.querySelectorAll('.tab-item, .has-sub, .drop-link').forEach(el => {
        el.classList.remove('searching', 'match-highlight');
        if(el.classList.contains('tab-item')) el.style.display = q ? 'none' : 'block';
    });
    if (!q) return;
    document.querySelectorAll('.drop-link').forEach(link => {
        if (link.innerText.toLowerCase().includes(q) || (link.dataset.tags && link.dataset.tags.includes(q))) {
            link.classList.add('match-highlight');
            let p = link.closest('.tab-item'); if(p) { p.style.display='block'; p.classList.add('searching'); }
            let s = link.closest('.has-sub'); if(s) s.classList.add('searching');
        }
    });
}

function toggleFeedback() { const m = document.getElementById('feedback-modal'); m.style.display = (m.style.display === 'flex') ? 'none' : 'flex'; }
function sendFeedback() { alert("Notes Saved Successfully!"); toggleFeedback(); }

window.onload = () => {
    build(tabsData, document.getElementById('tabs-row'), true);
    // Set initial background
    document.getElementById('bg-overlay').style.backgroundImage = `url('${bgImages[0]}')`;
};
</script>
</body>
</html>
