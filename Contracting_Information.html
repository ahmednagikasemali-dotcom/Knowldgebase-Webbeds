<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Contacts</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{
  --bg:#f8f9fa;
  --card:#fff;
  --text:#222;
  --border:#ddd;
  --primary:#0d6efd;
}
body.dark{
  --bg:#121212;
  --card:#1e1e1e;
  --text:#f1f1f1;
  --border:#333;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:"Segoe UI",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
.container{
  max-width:1300px;
  margin:auto;
  padding:20px;
}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
}
.search-box{
  position:relative;
}
.search-box input{
  width:280px;
  padding:10px 35px 10px 12px;
  border:1px solid var(--border);
  border-radius:6px;
  background:var(--card);
  color:var(--text);
}
.search-box i{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
}
.actions{
  display:flex;
  gap:15px;
  font-size:20px;
}
.actions i{
  cursor:pointer;
  color:var(--primary);
}
.table-wrapper{
  margin-top:15px;
  background:var(--card);
  border-radius:8px;
  overflow-x:auto;
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}
th,td{
  padding:10px;
  border-bottom:1px solid var(--border);
  text-align:left;
}
th{
  background:rgba(0,0,0,.03);
  cursor:pointer;
}
tr:hover{
  background:rgba(0,0,0,.04);
}
a{
  color:var(--primary);
  text-decoration:none;
}
.empty{color:#888;font-style:italic;}
.pagination{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:15px;
}
.pagination button{
  padding:6px 12px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  cursor:pointer;
}
.pagination button.active{
  background:var(--primary);
  color:#fff;
}
</style>
</head>
<body>

<div class="container">

<header>
  <div class="search-box">
    <input id="search" placeholder="Search Name, Region, Position, Team, Email...">
    <i class="fa-solid fa-magnifying-glass"></i>
  </div>

  <div class="actions">
    <i class="fa-solid fa-house" title="Home" onclick="goHome()"></i>
    <i class="fa-solid fa-moon" title="Dark mode" onclick="toggleTheme()"></i>
  </div>
</header>

<div class="table-wrapper">
<table>
<thead>
<tr>
  <th onclick="sortBy('name')">Name</th>
  <th onclick="sortBy('region')">Region</th>
  <th onclick="sortBy('position')">Position</th>
  <th onclick="sortBy('team')">Team</th>
  <th onclick="sortBy('email')">Email</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<div class="pagination" id="pagination"></div>

</div>

// ======= إعدادات =======
const rowsPerPage = 10;
let currentPage = 1;
let currentData = [...data];
let sortDir = 1;

const tbody = document.getElementById("tbody");
const pagination = document.getElementById("pagination");
const search = document.getElementById("search");

// ======= دوال مساعدة =======
function createCell(value,type){
  if(!value) return `<span class="empty">—</span>`;
  if(type==="email") return `<a href="mailto:${value}">${value}</a>`;
  return value;
}

function render(){
  const start = (currentPage-1)*rowsPerPage;
  const pageData = currentData.slice(start,start+rowsPerPage);
  tbody.innerHTML = pageData.map(r=>`
    <tr>
      <td>${r.name}</td>
      <td>${r.region}</td>
      <td>${r.position}</td>
      <td>${r.team}</td>
      <td>${createCell(r.email,"email")}</td>
    </tr>`).join("");
  renderPagination();
}

function renderPagination(){
  pagination.innerHTML="";
  const pages = Math.ceil(currentData.length / rowsPerPage);
  for(let i=1;i<=pages;i++){
    pagination.innerHTML+=`
      <button class="${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
  }
}

function goPage(p){
  currentPage=p;
  render();
}

search.oninput=()=>{
  const v = search.value.toLowerCase();
  currentData = data.filter(r =>
    Object.values(r).join(" ").toLowerCase().includes(v)
  );
  currentPage = 1;
  render();
};

function sortBy(key){
  sortDir *= -1;
  currentData.sort((a,b)=>
    (a[key] || "").localeCompare(b[key] || "") * sortDir
  );
  render();
}

function toggleTheme(){
  document.body.classList.toggle("dark");
}

function goHome(){
  window.location.href = 'index.html'; // رابط الصفحة الرئيسية
}

// ======= بداية التشغيل =======
render();
